[project]
name = "lethe"
version = "0.1.0"
description = "Logless, traceless local LLM runner for Apple Silicon (llama.cpp + Metal)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.0",
    "ddgs>=9.16.0",
    "gguf>=0.19.0",
    "httpx>=0.28.1",
    "huggingface-hub[hf-xet]>=1.28.0",
    "prompt-toolkit>=3.0.53",
    "psutil>=7.2.2",
    "pypdf>=6.16.2",
    "rich>=15.0.0",
    "trafilatura>=2.2.0",
    "typer>=0.27.1",
]

[project.scripts]
lethe = "lethe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lethe"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
